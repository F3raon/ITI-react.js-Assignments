<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - UI/UX Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="control-panel">
        <button id="btn-theme" class="ctrl-btn" title="Toggle Light / Dark Mode">
            <i class="fa-solid fa-moon"></i>
            <span>Theme</span>
        </button>

        <div class="color-picker-wrapper">
            <button id="btn-color" class="ctrl-btn" title="Choose Accent Color">
                <i class="fa-solid fa-palette"></i>
                <span>Colors</span>
            </button>

            <div id="color-palette-popup" class="color-palette-popup">
                <div class="palette-header">Select Accent Color</div>
                <div class="color-swatches">
                    <span class="color-dot" data-color="#f95700" style="background-color: #f95700;"></span>
                    <span class="color-dot" data-color="#0ea5e9" style="background-color: #0ea5e9;"></span>
                    <span class="color-dot" data-color="#a855f7" style="background-color: #a855f7;"></span>
                    <span class="color-dot" data-color="#10b981" style="background-color: #10b981;"></span>
                    <span class="color-dot" data-color="#ef4444" style="background-color: #ef4444;"></span>
                    <span class="color-dot" data-color="#f59e0b" style="background-color: #f59e0b;"></span>
                    <span class="color-dot" data-color="#ec4899" style="background-color: #ec4899;"></span>
                    <span class="color-dot" data-color="#06b6d4" style="background-color: #06b6d4;"></span>
                </div>
                <div class="custom-picker-row">
                    <label for="custom-color-input">Custom Color:</label>
                    <input type="color" id="custom-color-input" value="#f95700">
                </div>
            </div>
        </div>
    </aside>

    <header class="header">
        <div class="container nav-container">
            <a href="Index.html" class="logo">LOGO</a>

            <nav class="nav-menu">
                <a href="#home" class="nav-link active">Home</a>
                <a href="#services" class="nav-link">Services</a>
                <a href="#about" class="nav-link">About me</a>
                <a href="#portfolio" class="nav-link">Portfolio</a>
                <a href="#contact" class="nav-link">Contact me</a>
            </nav>

            <a href="#contact" class="btn btn-primary hire-btn">Hire Me</a>
        </div>
    </header>

    <main>
        <section id="home" class="hero-section">
            <div class="container hero-container">
                <div class="hero-content">
                    <span class="greeting">Hi I am</span>
                    <h2 class="author-name">Ahmed Hamada</h2>
                    <h1 class="job-heading">.Net Developer</h1>

                    <div class="social-links">
                        <a href="#" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                        <a href="#" class="social-icon" aria-label="Dribbble"><i class="fa-brands fa-dribbble"></i></a>
                        <a href="#" class="social-icon" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>
                    </div>

                    <div class="cta-buttons">
                        <a href="#contact" class="btn btn-primary">Hire Me</a>
                        <a href="#" class="btn btn-outline">Download CV</a>
                    </div>

                    <div class="stats-card">
                        <div class="stat-item">
                            <span class="stat-number">5+</span>
                            <span class="stat-label">Experiences</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-number">20+</span>
                            <span class="stat-label">Project done</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-number">80+</span>
                            <span class="stat-label">Happy Clients</span>
                        </div>
                    </div>
                </div>

                <div class="hero-image-wrapper">
                    <div class="circle-backdrop">
                        <img src="PortfolioImage.png" alt="Mahmood Fazile" class="hero-person-img">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
